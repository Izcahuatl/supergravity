[package]
name = "supergravity"
version = "0.1.0"
edition = "2021"

[lib]
name = "supergravity"
path = "src/lib.rs"

[[bin]]
name = "supergravity"
path = "src/main.rs"

[dependencies]
async-stream = "0.3.6"
async-trait = "0.1.89"
directories = "6.0.0"
futures = "0.3.32"
glob = "0.3.3"
keyring = "4.1.5"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-notification = "2.3.3"
thiserror = "2.0.18"
tokio = { version = "1.52.4", features = ["rt-multi-thread", "macros", "time", "process", "sync"] }
tokio-util = "0.7.18"
toml = "1.1.3"
uuid = { version = "1.24.0", features = ["v4"] }
walkdir = "2.5.0"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
